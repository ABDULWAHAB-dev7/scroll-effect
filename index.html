<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Global Logistics Journey</title>

  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Barlow+Condensed:wght@600;700;800;900&display=swap" rel="stylesheet" />
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/lenis@1.3.26/dist/lenis.css" />
  <script src="https://cdn.jsdelivr.net/npm/gsap@3.15.0/dist/gsap.min.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/gsap@3.15.0/dist/ScrollTrigger.min.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/lenis@1.3.26/dist/lenis.min.js"></script>

  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    html,
    body {
      background-color: #050811;
      color: #ffffff;
      font-family: "Barlow Condensed", "Arial Narrow", Impact, sans-serif;
    }

    body {
      overflow-x: hidden;
    }

    .scroll-track {
      height: 1200vh;
      position: relative;
    }

    .stage {
      position: sticky;
      top: 0;
      width: 100vw;
      height: 100vh;
      overflow: hidden;
    }

    canvas {
      position: absolute;
      top: 0;
      left: 0;
      width: 100%;
      height: 100%;
      display: block;
      z-index: 1;
      pointer-events: none;
    }

    .vignette {
      position: absolute;
      inset: 0;
      z-index: 2;
      pointer-events: none;
      background: radial-gradient(ellipse 58% 52% at 50% 50%, rgba(5, 8, 17, 0) 0%, rgba(5, 8, 17, 0.6) 100%);
    }

    .caption-box {
      position: absolute;
      inset: 0;
      z-index: 3;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      text-align: center;
      padding: 0 6vw;
      pointer-events: none;
    }

    .chapter-tag {
      font-size: clamp(13px, 1.2vw, 16px);
      font-weight: 800;
      color: #1e6bff;
      text-transform: uppercase;
      letter-spacing: 0.3em;
      margin-bottom: 16px;
      text-shadow: 0 0 18px rgba(30, 107, 255, 0.45), 0 2px 10px rgba(0, 0, 0, 0.8);
    }

    .mask {
      display: block;
      overflow: hidden;
      padding-bottom: 0.08em;
      margin-bottom: -0.08em;
    }

    .line {
      display: block;
      white-space: nowrap;
      will-change: transform;
    }

    .title {
      font-size: clamp(3.2rem, 9vw, 8.5rem);
      font-weight: 900;
      text-transform: uppercase;
      letter-spacing: 0.02em;
      line-height: 0.9;
      text-shadow: 0 8px 36px rgba(0, 0, 0, 0.75);
    }

    #loader {
      position: fixed;
      inset: 0;
      background: #050811;
      z-index: 999;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      gap: 15px;
    }

    .loader-label {
      font-family: "Barlow Condensed", "Arial Narrow", Impact, sans-serif;
      font-size: 14px;
      font-weight: 700;
      letter-spacing: 0.2em;
      text-transform: uppercase;
    }

    .bar {
      width: 200px;
      height: 3px;
      background: rgba(255, 255, 255, 0.1);
      border-radius: 99px;
      overflow: hidden;
    }

    .progress {
      width: 0%;
      height: 100%;
      background: #1e6bff;
    }
  </style>
</head>
<body>

  <div id="loader">
    <div class="loader-label">Buffering Experience</div>
    <div class="bar"><div class="progress" id="progress"></div></div>
  </div>

  <div class="scroll-track" id="track">
    <div class="stage">
      <canvas id="canvas"></canvas>
      <div class="vignette" aria-hidden="true"></div>

      <div class="caption-box" id="chap1">
        <p class="chapter-tag">Stage 01 / Ground Fleet</p>
        <h2 class="title"><span class="mask"><span class="line">Freight In Motion</span></span></h2>
      </div>

      <div class="caption-box" id="chap2">
        <p class="chapter-tag">Stage 02 / Warehouse &amp; CFS</p>
        <h2 class="title"><span class="mask"><span class="line">Automated Handling</span></span></h2>
      </div>

      <div class="caption-box" id="chap3">
        <p class="chapter-tag">Stage 03 / Ocean Transit</p>
        <h2 class="title"><span class="mask"><span class="line">Deep Sea Container Line</span></span></h2>
      </div>

      <div class="caption-box" id="chap4">
        <p class="chapter-tag">Stage 04 / Port Clearance</p>
        <h2 class="title"><span class="mask"><span class="line">ICEGATE &amp; Customs Gate</span></span></h2>
      </div>
    </div>
  </div>

  <script>
    const CHAPTERS = [
      { folder: "assets/chapter1", count: 144 },
      { folder: "assets/chapter2", count: 168 },
      { folder: "assets/chapter3", count: 168 },
      { folder: "assets/chapter4", count: 168 }
    ];

    const TOTAL_FRAMES = CHAPTERS.reduce((sum, chapter) => sum + chapter.count, 0);
    const CHAPTER_STARTS = [];
    CHAPTERS.reduce((start, chapter) => {
      CHAPTER_STARTS.push(start);
      return start + chapter.count;
    }, 0);

    const FRAME_URLS = CHAPTERS.flatMap((chapter) =>
      Array.from({ length: chapter.count }, (_, i) =>
        `${chapter.folder}/frame_${String(i + 1).padStart(4, "0")}.webp`
      )
    );

    const MAX_DEVICE_PIXEL_RATIO = 2;
    const PRELOAD_CONCURRENCY = 6;
    const DISSOLVE_FRAMES = 2;

    const canvas = document.getElementById("canvas");
    const ctx = canvas.getContext("2d");
    const loader = document.getElementById("loader");
    const progressBar = document.getElementById("progress");

    const frames = new Array(TOTAL_FRAMES);
    let requestedFrame = -1;

    gsap.registerPlugin(ScrollTrigger);

    const lenis = new Lenis({ lerp: 0.07, smoothWheel: true });
    lenis.on("scroll", ScrollTrigger.update);
    gsap.ticker.add((time) => lenis.raf(time * 1000));
    gsap.ticker.lagSmoothing(0);

    function coverRect(canvasWidth, canvasHeight, imageWidth, imageHeight) {
      const scale = Math.max(canvasWidth / imageWidth, canvasHeight / imageHeight);
      const width = imageWidth * scale;
      const height = imageHeight * scale;
      return {
        x: (canvasWidth - width) / 2,
        y: (canvasHeight - height) / 2,
        width,
        height
      };
    }

    window.__coverRect = coverRect;

    function chapterOf(index) {
      let chapter = 0;
      for (let k = 1; k < CHAPTER_STARTS.length; k++) {
        if (index >= CHAPTER_STARTS[k]) chapter = k;
      }
      return chapter;
    }

    function nearestLoaded(index) {
      let source = index;
      while (source > 0 && !frames[source]) source--;
      return frames[source] ? source : -1;
    }

    function paintCover(image) {
      const rect = coverRect(canvas.width, canvas.height, image.naturalWidth, image.naturalHeight);
      ctx.drawImage(image, rect.x, rect.y, rect.width, rect.height);
    }

    function drawFrame(index) {
      const source = nearestLoaded(index);
      if (source === -1) return;

      const chapter = chapterOf(source);
      const offset = source - CHAPTER_STARTS[chapter];
      const previousIndex = CHAPTER_STARTS[chapter] - 1;
      const dissolving = chapter > 0 && offset < DISSOLVE_FRAMES && frames[previousIndex];

      ctx.imageSmoothingEnabled = true;
      ctx.imageSmoothingQuality = "high";
      ctx.globalAlpha = 1;
      ctx.clearRect(0, 0, canvas.width, canvas.height);

      if (dissolving) {
        paintCover(frames[previousIndex]);
        ctx.globalAlpha = (offset + 1) / (DISSOLVE_FRAMES + 1);
      }

      paintCover(frames[source]);
      ctx.globalAlpha = 1;
      canvas.dataset.frame = String(source);
    }

    function showFrame(index) {
      if (index === requestedFrame) return;
      requestedFrame = index;
      drawFrame(index);
    }

    function resizeCanvas() {
      const dpr = Math.min(window.devicePixelRatio || 1, MAX_DEVICE_PIXEL_RATIO);
      const width = Math.round(window.innerWidth * dpr);
      const height = Math.round(window.innerHeight * dpr);
      if (canvas.width !== width || canvas.height !== height) {
        canvas.width = width;
        canvas.height = height;
      }
      drawFrame(Math.max(requestedFrame, 0));
    }

    window.addEventListener("resize", resizeCanvas);
    resizeCanvas();

    let framesDone = 0;
    let framesFailed = 0;

    function updateLoader() {
      const percent = (framesDone / TOTAL_FRAMES) * 100;
      gsap.to(progressBar, { width: `${percent}%`, duration: 0.3, ease: "power1.out", overwrite: true });
    }

    function hideLoader() {
      gsap.to(loader, {
        opacity: 0,
        duration: 0.5,
        onComplete: () => loader.remove()
      });
    }

    async function preloadFrames() {
      let next = 0;

      async function worker() {
        while (next < TOTAL_FRAMES) {
          const index = next++;
          const image = new Image();
          image.decoding = "async";
          image.src = FRAME_URLS[index];

          try {
            await image.decode();
            frames[index] = image;
          } catch (error) {
            framesFailed++;
          }

          framesDone++;
          updateLoader();
          if (requestedFrame === -1) drawFrame(0);
        }
      }

      await Promise.all(Array.from({ length: PRELOAD_CONCURRENCY }, worker));
    }

    const masterTL = gsap.timeline({
      scrollTrigger: {
        trigger: "#track",
        start: "top top",
        end: "bottom bottom",
        scrub: 1.4
      }
    });

    const frameState = { frame: 0 };
    masterTL.to(frameState, {
      frame: TOTAL_FRAMES - 1,
      ease: "none",
      duration: 1,
      onUpdate: () => showFrame(Math.round(frameState.frame))
    }, 0);

    CHAPTERS.forEach((chapter, k) => {
      const startFrame = CHAPTER_STARTS[k];
      const endFrame = startFrame + chapter.count - 1;
      const start = startFrame / (TOTAL_FRAMES - 1);
      const end = endFrame / (TOTAL_FRAMES - 1);
      const span = end - start;

      const caption = document.getElementById(`chap${k + 1}`);
      const tag = caption.querySelector(".chapter-tag");
      const lines = caption.querySelectorAll(".line");

      masterTL.fromTo(tag,
        { opacity: 0, y: 18 },
        { opacity: 1, y: 0, duration: span * 0.25, ease: "none" },
        start
      );

      masterTL.fromTo(lines,
        { yPercent: 110 },
        { yPercent: 0, duration: span * 0.25, ease: "none" },
        start
      );

      masterTL.to(caption,
        { y: -40, opacity: 0, duration: span * 0.25, ease: "none" },
        start + span * 0.75
      );
    });

    masterTL.set({}, {}, 1);

    preloadFrames().then(() => {
      resizeCanvas();
      hideLoader();
    });
  </script>
</body>
</html>
