<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Global Logistics Journey</title>

  <script src="https://cdn.jsdelivr.net/npm/gsap@3.12.5/dist/gsap.min.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/gsap@3.12.5/dist/ScrollTrigger.min.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/@studio-freight/lenis@1.0.42/dist/lenis.min.js"></script>

  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    body {
      background-color: #050811;
      color: #ffffff;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
      overflow-x: hidden;
    }

    .scroll-track {
      height: 1200vh;
      position: relative;
    }

    .stage {
      position: sticky;
      top: 0;
      width: 100vw;
      height: 100vh;
      overflow: hidden;
      display: flex;
      align-items: center;
      justify-content: center;
    }

    canvas {
      position: absolute;
      top: 0;
      left: 0;
      width: 100%;
      height: 100%;
      z-index: 1;
      pointer-events: none;
    }

    .caption-box {
      position: absolute;
      z-index: 2;
      text-align: center;
      padding: 0 30px;
    }

    .chapter-tag {
      font-size: 14px;
      font-weight: 700;
      color: #3b82f6;
      text-transform: uppercase;
      letter-spacing: 0.2em;
      margin-bottom: 12px;
      opacity: 0;
      transform: translateY(20px);
    }

    .title {
      font-size: clamp(2.5rem, 6vw, 5rem);
      font-weight: 900;
      text-transform: uppercase;
      letter-spacing: -0.03em;
      line-height: 1.05;
      opacity: 0;
      transform: translateY(30px);
      text-shadow: 0 10px 40px rgba(0, 0, 0, 0.8);
    }

    #loader {
      position: fixed;
      inset: 0;
      background: #050811;
      z-index: 999;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      gap: 15px;
      transition: opacity 0.6s ease;
    }

    .bar {
      width: 200px;
      height: 3px;
      background: rgba(255, 255, 255, 0.1);
      border-radius: 99px;
      overflow: hidden;
    }

    .progress {
      width: 0%;
      height: 100%;
      background: #3b82f6;
      transition: width 0.1s linear;
    }
  </style>
</head>
<body>

  <div id="loader">
    <div style="font-size: 14px; letter-spacing: 0.1em; text-transform: uppercase;">Buffering Experience</div>
    <div class="bar"><div class="progress" id="progress"></div></div>
  </div>

  <div class="scroll-track" id="track">
    <div class="stage">
      <canvas id="canvas"></canvas>

      <div class="caption-box" id="chap1">
        <p class="chapter-tag" id="tag1">Stage 01 / Ground Fleet</p>
        <p class="title" id="t1">Freight In Motion</p>
      </div>

      <div class="caption-box" id="chap2">
        <p class="chapter-tag" id="tag2">Stage 02 / Warehouse & CFS</p>
        <p class="title" id="t2">Automated Handling</p>
      </div>

      <div class="caption-box" id="chap3">
        <p class="chapter-tag" id="tag3">Stage 03 / Ocean Transit</p>
        <p class="title" id="t3">Deep Sea Container Line</p>
      </div>

      <div class="caption-box" id="chap4">
        <p class="chapter-tag" id="tag4">Stage 04 / Port Clearance</p>
        <p class="title" id="t4">ICEGATE & Customs Gate</p>
      </div>
    </div>
  </div>

  <script>
    const CHAPTERS = [
      { folder: 'assets/chapter1', count: 144 },
      { folder: 'assets/chapter2', count: 168 },
      { folder: 'assets/chapter3', count: 168 },
      { folder: 'assets/chapter4', count: 168 }
    ];

    const canvas = document.getElementById("canvas");
    const ctx = canvas.getContext("2d");

    const loadedAssets = [[], [], [], []];
    const state = { activeChapter: 0, frameIndex: 0 };

    const lenis = new Lenis({ lerp: 0.08, smoothWheel: true });
    lenis.on("scroll", ScrollTrigger.update);
    gsap.ticker.add((time) => lenis.raf(time * 1000));
    gsap.ticker.lagSmoothing(0);

    function resizeCanvas() {
      const dpr = Math.min(window.devicePixelRatio || 1, 2);
      canvas.width = window.innerWidth * dpr;
      canvas.height = window.innerHeight * dpr;
      canvas.style.width = `${window.innerWidth}px`;
      canvas.style.height = `${window.innerHeight}px`;
      render();
    }

    function render() {
      const currentList = loadedAssets[state.activeChapter];
      if (!currentList || !currentList[state.frameIndex]) return;

      const img = currentList[state.frameIndex];
      if (!img || !img.complete) return;

      ctx.imageSmoothingEnabled = true;
      ctx.imageSmoothingQuality = "high";

      const hRatio = canvas.width / img.width;
      const vRatio = canvas.height / img.height;
      const ratio = Math.max(hRatio, vRatio);

      const shiftX = (canvas.width - img.width * ratio) / 2;
      const shiftY = (canvas.height - img.height * ratio) / 2;

      ctx.clearRect(0, 0, canvas.width, canvas.height);
      ctx.drawImage(
        img,
        0, 0, img.width, img.height,
        shiftX, shiftY, img.width * ratio, img.height * ratio
      );
    }

    window.addEventListener("resize", resizeCanvas);

    const totalImages = CHAPTERS.reduce((sum, ch) => sum + ch.count, 0);
    let loadedImages = 0;
    const progressEl = document.getElementById("progress");
    const loaderEl = document.getElementById("loader");

    CHAPTERS.forEach((ch, chIdx) => {
      for (let i = 1; i <= ch.count; i++) {
        const img = new Image();
        img.src = `${ch.folder}/frame_${String(i).padStart(4, '0')}.webp`;
        img.onload = () => {
          loadedImages++;
          progressEl.style.width = `${(loadedImages / totalImages) * 100}%`;
          if (loadedImages === 1) resizeCanvas();
          if (loadedImages === totalImages) {
            gsap.to(loaderEl, { opacity: 0, duration: 0.5, onComplete: () => loaderEl.remove() });
          }
        };
        loadedAssets[chIdx].push(img);
      }
    });

    gsap.registerPlugin(ScrollTrigger);

    const masterTL = gsap.timeline({
      scrollTrigger: {
        trigger: "#track",
        start: "top top",
        end: "bottom bottom",
        scrub: 1.0,
      }
    });

    CHAPTERS.forEach((ch, idx) => {
      const stepStart = idx * 10;

      const chapterState = { frame: 0 };
      masterTL.to(chapterState, {
        frame: ch.count - 1,
        snap: "frame",
        ease: "none",
        duration: 10,
        onUpdate: () => {
          state.activeChapter = idx;
          state.frameIndex = Math.round(chapterState.frame);
          render();
        }
      }, stepStart);

      const tag = `#tag${idx + 1}`;
      const title = `#t${idx + 1}`;

      masterTL.to([tag, title], { opacity: 1, y: 0, duration: 2, stagger: 0.2 }, stepStart + 1)
              .to([tag, title], { opacity: 0, y: -30, duration: 2, stagger: 0.2 }, stepStart + 7);
    });
  </script>
</body>
</html>
